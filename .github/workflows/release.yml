name: Release

# Builds a self-contained archive of the reproducibility package and publishes
# it as a GitHub Release whenever a version tag (v*) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package reproducibility artifacts
        run: |
          zip -r "mechano-phn-gse342782-reanalysis-${GITHUB_REF_NAME}.zip" \
            README.md CITATION.cff LICENSE MANIFEST.json \
            analysis/config analysis/scripts analysis/results \
            manuscript

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "mechano-phn-gse342782-reanalysis-${GITHUB_REF_NAME}.zip"
          generate_release_notes: true
